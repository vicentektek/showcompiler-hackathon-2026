name: Core tests
on:
  push:
    branches:
      - feat/hackathon-script-core
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:syntax
      - run: npm test
      - name: Build original demo with three real WAV cues
        run: npm run demo:package
      - name: Verify standard ZIP format independently
        run: unzip -t demo/SHOWCOMPILER_SHOW_DEMO.showcompiler.zip
      - name: Publish self-contained show demo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: showcompiler-full-demo-zip
          path: demo/SHOWCOMPILER_SHOW_DEMO.showcompiler.zip
          if-no-files-found: error
          retention-days: 14
